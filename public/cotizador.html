<!doctype html>
<html lang="es-CO">
<head><link rel="manifest" href="/manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Herramientas"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="/icons/favicon-32.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Cotizador · Mis Herramientas</title>
<style>
:root{--w:456px;--c1:#0f766e;--c2:#f59e0b;--g2:#3d8f78;--on1:#ffffff;--on2:#1f2933;--tint:#e7f2f1;--bg:#f0f7f6;--bg2:#e3efed;
  --ink:#1b2430;--muted:#6b7684;--line:#e6eaef;--card:#ffffff;--sh:0 8px 26px rgba(20,40,70,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg2);-webkit-text-size-adjust:100%}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15px;margin:18px 0 8px}
p{margin:0 0 10px}
small,.hint{color:var(--muted);font-size:13px}
.hint{display:block;margin-bottom:12px}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:env(safe-area-inset-top,0px);background:var(--c1);z-index:10}
#fatal{background:#7f1d1d;color:#fff;padding:20px;font-size:20px;font-weight:700;white-space:pre-wrap;position:relative;z-index:99}

/* ---- marco de app ---- */
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;box-shadow:0 0 60px rgba(20,40,70,.12)}
.hero{position:relative;overflow:hidden;padding:18px 18px 58px;color:var(--on1);background:linear-gradient(135deg,var(--c1) 0%,var(--g2) 100%);border-radius:0 0 34px 34px}
.hero::before{content:"";position:absolute;right:-70px;top:-95px;width:270px;height:270px;border-radius:50%;background:rgba(255,255,255,.17)}
.hero::after{content:"";position:absolute;left:-80px;bottom:-130px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,var(--c2) 0%,transparent 68%);opacity:.7}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.avatar img{width:100%;height:100%;object-fit:contain;padding:4px}
.avatar svg{width:25px;height:25px;color:var(--c1)}
.hi{font-size:13px;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:290px}
.hero h1{margin:0;font-size:23px;line-height:1.15}
.hero .sub{opacity:.92;font-size:13.5px;margin-top:12px}
.sbox{position:relative;margin-top:14px}
.sbox svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--c1);pointer-events:none}
.sbox input{padding-left:48px;border-radius:999px;border:0;box-shadow:0 8px 22px rgba(0,0,0,.16);min-height:48px;background:#fff}
.wrap{position:relative;z-index:2;margin-top:-34px;padding:0 16px 190px}

/* ---- tarjetas y textos ---- */
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.sec-title{font-size:16px;font-weight:700;margin:20px 4px 4px}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.link{background:none;border:0;color:var(--c1);font-weight:700;font-size:14px;cursor:pointer;padding:8px 4px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:13px;font-weight:600;color:var(--muted);padding-left:4px}
input,select,textarea{width:100%;min-height:48px;padding:10px 14px;border:1.5px solid #e1e6ec;border-radius:16px;background:#fbfcfd;font-size:16px}
textarea{min-height:92px;resize:vertical}
input[type=color]{padding:4px;height:50px;cursor:pointer;border-radius:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--c1);box-shadow:0 0 0 4px color-mix(in srgb,var(--c1) 18%,transparent);background:#fff}
button:focus-visible,label:focus-visible{outline:3px solid color-mix(in srgb,var(--c1) 40%,transparent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid #d5dbe3;background:#fff;font-weight:700;cursor:pointer;text-align:center;width:auto;color:var(--ink)}
.btn.primary{background:linear-gradient(100deg,var(--c1),var(--g2));border-color:transparent;color:var(--on1);box-shadow:0 8px 20px color-mix(in srgb,var(--c1) 32%,transparent)}
.btn.accent{background:var(--c2);border-color:var(--c2);color:var(--on2)}
.btn.danger{color:#b42318;border-color:#f1c0bb;background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.icon{width:42px;height:42px;border:0;background:var(--tint);color:var(--c1);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:19px;height:19px}
.icon.dng{background:#fdecea;color:#b42318}
.add{width:46px;height:46px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--g2));color:var(--on1);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 16px color-mix(in srgb,var(--c1) 35%,transparent)}
.add svg{width:22px;height:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:14px}
.row>.grow{flex:1 1 100%}
.logoRow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logoBox{width:150px;height:84px;border:2px dashed #cdd3da;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:#fff;overflow:hidden}
.logoBox img{max-width:100%;max-height:100%;object-fit:contain}
.col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.sw{width:56px;height:42px;border-radius:14px;border:2px solid #fff;box-shadow:0 0 0 1px #cdd3da;cursor:pointer;padding:0;overflow:hidden;display:flex}
.sw i{flex:1}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.banner{background:#fff4e5;border:1px solid #f5c98a;color:#7a4a00;padding:12px 14px;border-radius:18px;margin-bottom:14px;font-size:14px}
.empty{padding:26px 12px;text-align:center;color:var(--muted);background:#fff;border-radius:22px;box-shadow:var(--sh)}

/* ---- atajos de vidrio ---- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:24px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1.5px solid #fff;box-shadow:var(--sh);font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;text-align:center;min-height:0;width:auto}
.tile i{width:50px;height:50px;border-radius:18px;background:linear-gradient(145deg,var(--tint),#fff);display:flex;align-items:center;justify-content:center;color:var(--c1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 4px 10px rgba(20,40,70,.09)}
.tile svg{width:24px;height:24px}

/* ---- ítems ---- */
.item{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:10px;border-radius:22px;background:#fff;box-shadow:var(--sh)}
.av{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,var(--tint),#fff);color:var(--c1);font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1px rgba(20,40,70,.06)}
.item .meta{min-width:0;flex:1}
.item strong{display:block;overflow-wrap:anywhere;line-height:1.25}
.item small{display:block;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex:none}
.pill{display:inline-block;background:var(--tint);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;margin:4px 4px 0 0;font-weight:600}
.pill.on{background:var(--c1);color:var(--on1)}
.line{border-radius:22px;padding:14px;margin-bottom:12px;background:#fff;box-shadow:var(--sh)}
.l-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.l-name{flex:1;min-width:0}
.l-name strong{display:block;overflow-wrap:anywhere}
.l-name small{display:block;overflow-wrap:anywhere}
.l-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;align-items:end}
.stepper{display:flex;gap:6px}
.stepper button{min-width:44px;border:0;background:var(--tint);color:var(--c1);border-radius:50%;font-size:22px;font-weight:700;cursor:pointer}
.stepper input{text-align:center;min-width:0;border-radius:16px}
.ivactl{display:flex;gap:6px}
.ivactl .oth{max-width:84px}
.l-total{display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end}
.l-total span{font-size:12px;color:var(--muted)}
.l-total b{font-size:18px}

/* ---- tarjeta de total (vidrio sobre degradado) ---- */
.card.pay{background:linear-gradient(150deg,var(--c1),var(--g2));color:var(--on1);position:relative;overflow:hidden}
.card.pay::before{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.15)}
.card.pay::after{content:"";position:absolute;left:-70px;bottom:-100px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--c2) 0%,transparent 68%);opacity:.6}
.card.pay>*{position:relative;z-index:1}
.pay .hint{color:rgba(255,255,255,.88)}
.tot .tr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.28)}
.tot .tr.big{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.55);border-radius:20px;padding:14px 16px;margin-top:12px;font-size:22px;font-weight:800;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pay .btn{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.6);color:inherit;box-shadow:none}
.pay .btn.primary{background:#fff;color:var(--c1);border-color:#fff;box-shadow:0 10px 26px rgba(0,0,0,.2)}
.pay .btn.accent{background:var(--c2);border-color:var(--c2);color:var(--on2)}
.pay .btn:disabled{opacity:.5}

/* ---- barra de total flotante y navegación ---- */
.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 94px);width:min(var(--w),calc(100vw - 24px));display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 10px 18px;border-radius:24px;background:linear-gradient(100deg,var(--c1),var(--g2));color:var(--on1);box-shadow:0 14px 32px color-mix(in srgb,var(--c1) 42%,transparent);z-index:19}
.mini small{display:block;color:inherit;opacity:.88;font-size:12px}
.mini b{font-size:20px}
.mini .btn{background:#fff;color:var(--c1);border:0;min-height:44px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(var(--w),calc(100vw - 24px));display:flex;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:30px;box-shadow:0 12px 36px rgba(20,40,70,.2);padding:8px;z-index:20}
.nav button{flex:1;min-width:0;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 11px;color:#98a2b3;font-size:10.5px;font-weight:700;cursor:pointer;border-radius:22px;position:relative}
.nav svg{width:25px;height:25px}
.nav button[aria-selected=true]{color:var(--c1)}
.nav button[aria-selected=true]::after{content:"";width:18px;height:4px;border-radius:4px;background:var(--c1);position:absolute;bottom:3px}
.hq{background:#fff;border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.hq-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.hq .meta{min-width:0;flex:1}
.hq strong{display:block;overflow-wrap:anywhere}
.hq small{display:block}
.hq-tot{font-size:18px;white-space:nowrap}
.hq-mid{margin-top:10px}
select.st{width:auto;min-height:34px;padding:0 30px 0 14px;border-radius:999px;font-size:13px;font-weight:700;border:0;background-color:var(--tint);color:var(--ink)}
select.st-enviada{background-color:#dbeafe;color:#1e40af}
select.st-aceptada{background-color:#dcfce7;color:#166534}
select.st-rechazada{background-color:#fee2e2;color:#991b1b}
.hq-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.hq-acts .btn{flex:1 1 0;padding:0 10px}
.tcard{background:#fff;border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px}
.tc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tc-top strong{overflow-wrap:anywhere;min-width:0}
.tc-tot{white-space:nowrap;font-size:18px}
.tc-items{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.tc-meta{display:flex;flex-wrap:wrap}
.tc-sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding:12px 14px;background:var(--tint);border-radius:16px}
.tc-sum b{font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #d5dbe3;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);min-height:40px;max-width:100%;overflow-wrap:anywhere}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin:22px 8px 0}

/* ---- avisos y ventanas ---- */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:#1f2933;color:#fff;padding:12px 18px;border-radius:18px;font-size:15px;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.on{opacity:1}
.ov{position:fixed;inset:0;background:rgba(15,23,32,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.md{background:#fff;width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom) + 18px)}
.md::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:#d5dbe3;margin:-8px auto 14px}
.err{color:#b42318;font-size:13px;margin-top:6px;min-height:1em}
[hidden]{display:none!important}

/* ---- vista previa: hoja carta escalada (igual al PDF) ---- */
#pvBox{position:relative;overflow:hidden;border-radius:18px;box-shadow:0 6px 22px rgba(20,40,70,.16);background:#f3f3f5}
#preview{width:612px;transform-origin:top left}
.paper{width:612px;min-height:792px;padding:44px;display:flex;flex-direction:column;color:#1c1c1e;font-size:9.5px;line-height:1.3}
.pm{display:flex;justify-content:space-between}
.pm .m2{margin-left:-60px}
.pm .m3{text-align:right}
.pl{display:block;font-size:7.5px;color:#6b6b73}
.pv{display:block;font-size:8.5px}
.pt{display:flex;justify-content:space-between;align-items:center;margin:22px 0 24px;min-height:56px}
.pt h1{font-size:40px;font-weight:400;margin:0;line-height:1;letter-spacing:-.5px}
.pbrand{text-align:right}
.pbrand img{display:block;margin:0 0 6px auto;max-height:40px;max-width:120px;object-fit:contain}
.pbrand b{font-size:11px}
.pi{display:flex;justify-content:space-between;gap:12px;margin-bottom:22px;font-size:8.5px}
.pi>div{flex:1}
.pi>div:last-child{text-align:right}
.pi b{font-size:10px}
.ptable{width:100%;border-collapse:collapse;table-layout:fixed}
.ptable th{font-weight:400;font-size:8.5px;text-align:right;padding:0 0 5px;border-bottom:1px solid #1c1c1e}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable td{padding:9px 0 3px;text-align:right;vertical-align:top;font-size:9.5px}
.ptable td .d{display:block;font-size:7.5px;color:#6b6b73}
.prule{border-top:1px solid #1c1c1e;margin-top:8px}
.pb{display:flex;justify-content:space-between;gap:30px;margin-top:20px}
.pb .vl{width:220px;font-size:8.5px}
.pb .tt{width:230px}
.pb .tr{display:flex;justify-content:space-between;font-size:8.5px;padding:2px 0}
.pb .tr span:first-child{color:#6b6b73}
.pb .gt{display:flex;align-items:center;gap:10px;margin-top:10px}
.pb .gt .lb{font-size:12px}
.pb .gt .ln{flex:1;border-top:1px solid #1c1c1e}
.pb .gt .vv{font-size:20px}
.pf{display:flex;justify-content:space-between;gap:30px;margin-top:auto;padding-top:28px}
.pf .th{font-size:15px;line-height:1.2;width:190px}
.pf .tc{width:250px;text-align:right;font-size:7.5px;color:#6b6b73}
.pf .tc b{display:block;color:#1c1c1e;font-size:8.5px;margin-bottom:3px}
.pf .tc p{margin:0 0 4px;white-space:pre-wrap}

/* ---- pantallas más anchas y teléfono horizontal ---- */
@media (min-width:640px){
  :root{--w:640px}
  .app{max-width:760px}
  .hero{padding:24px 28px 62px}.wrap{padding:0 24px 190px}
  .grid2{grid-template-columns:1fr 1fr}
  .md{max-width:560px;border-radius:30px;align-self:center}
  .nav button{font-size:12px}
}
@media (min-width:1024px){:root{--w:720px}.app{max-width:960px}}
@media (max-height:520px){
  .hero{padding:12px 18px 44px}.wrap{padding-bottom:150px}
  .nav button{flex-direction:row;justify-content:center;padding:10px 0;font-size:0}.nav button[aria-selected=true]::after{display:none}
  .nav button[aria-selected=true]{background:var(--tint)}
  .mini{bottom:calc(env(safe-area-inset-bottom) + 72px)}
}
</style>

<div id="fatal" hidden></div>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
/*PURE-START*/
const Core = (function(){
  'use strict';
  const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);

  /* ---------- números ---------- */
  function parseNum(v){
    if(typeof v==='number') return isFinite(v)?v:NaN;
    let s=String(v==null?'':v).trim().replace(/[%$\s ]/g,'');
    if(!s) return NaN;
    if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.');
    else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
    const n=Number(s);
    return isFinite(n)?n:NaN;
  }
  const group=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  function fmtInt(n){ const r=Math.round(Math.abs(n)); return (n<0&&r!==0?'-':'')+group(String(r)); }
  const fmtMoney=n=>'$ '+fmtInt(n);
  function moneyPlain(n){
    n=Number(n)||0; const r=Math.round(n*100)/100; const p=r.toFixed(2).split('.');
    return group(p[0])+(p[1]==='00'?'':','+p[1]);
  }
  const fmtMoney2=n=>'$ '+moneyPlain(n);
  function qtyPlain(q){ q=Number(q)||0; return String(Math.round(q*100)/100).replace('.',','); }
  const fmtQty=qtyPlain;
  const fmtPct=p=>qtyPlain(p)+'%';
  const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
  const dateLong=d=>d.getDate()+' de '+MONTHS[d.getMonth()]+' de '+d.getFullYear();

      const base=byRate[rate]*(1-gPct/100);

  /* ---------- CSV ---------- */
  function parseCSV(t){

      else if(c===sep){ row.push(cur);cur=''; }
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(cur);cur='';rows.push(row);row=[]; }

  }
  const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();

    const find=re=>heads.findIndex(h=>re.test(h));

    const iN=find(/^(nombre|producto|servicio|concepto|item|articulo)/), iP=find(/^(precio|valor|tarifa)/);

    }
    for(let i=start;i<rows.length;i++){
      const r=rows[i];
      const name=String(r[map.name]||'').trim();
      const price=parseNum(r[map.price]);
      if(!name||!isFinite(price)||price<0){ skipped++; continue; }

  /* Diseño: fondo suave, manchas difuminadas de la marca, título grande, líneas finas */
  function renderPdf(m){

      pg.blob(70,60,150,b1,BG);
      pg.blob(PW-40,PH-30,190,b2,BG);
      y=TOP;
      if(cont){ pg.text('Cotización '+m.number+' (continuación)',MX,y+8,8,false,MUTED); y+=34; }
    };
    newPage(false);

    /* fila de datos del documento */
    const meta=[['No. de cotización',m.number],['Fecha',m.date],['Válida hasta',m.validUntil]];
    pg.text(meta[0][0],MX,y+8,7.5,false,MUTED); pg.text(meta[0][1],MX,y+20,8.5,false,INK);
    pg.text(meta[1][0],MX+170,y+8,7.5,false,MUTED); pg.text(meta[1][1],MX+170,y+20,8.5,false,INK);
    pg.text(meta[2][0],PW-MX,y+8,7.5,false,MUTED,'right'); pg.text(meta[2][1],PW-MX,y+20,8.5,false,INK,'right');
    y+=44;

    /* título grande + marca a la derecha */
    pg.text('Cotización',MX,y+38,40,false,INK);
    let bh=0;
    if(img){ const sc=Math.min(120/img.w,40/img.h); const iw=img.w*sc, ih=img.h*sc; pg.image(PW-MX-iw,y+2,iw,ih); bh=ih+6; }
    if(B.name){ const nl=wrap(B.name,11,true,230); let ny=y+2+bh; for(const t of nl){ pg.text(t,PW-MX,ny+9,11,true,INK,'right'); ny+=13; } bh=ny-(y+2); }
    y+=Math.max(58,bh+4)+22;

    /* cliente · contacto · emisor */
    const cl=m.client;
    const colA=[],colB=[],colC=[];
    if(cl.name) for(const t of wrap(cl.name,10,true,160)) colA.push({t:t,b:true,s:10});
    if(cl.company) for(const t of wrap(cl.company,8.5,false,160)) colA.push({t:t,b:false,s:8.5});
    if(cl.email) for(const t of wrap(cl.email,8.5,false,160)) colB.push(t);
    if(cl.phone) colB.push(cl.phone);
    if(B.taxId) colC.push('NIT/CC: '+B.taxId);
    if(B.phone) colC.push(B.phone);
    if(B.email) for(const t of wrap(B.email,8.5,false,170)) colC.push(t);
    if(B.city) colC.push(B.city);
    const hasInfo=colA.length||colB.length||colC.length;
    if(hasInfo){

      pg.text('Emitida por',PW-MX,y+8,7.5,false,MUTED,'right');
      colA.forEach((l,i)=>pg.text(l.t,MX,y+23+i*12,l.s,l.b,INK));

      colC.forEach((t,i)=>pg.text(t,PW-MX,y+23+i*12,8.5,false,INK,'right'));

    }

    /* tabla */
    const cols=[232,52,96,48,96]; const cx=[]; { let a=MX; for(const w of cols){ cx.push(a); a+=w; } }

      pg.text('Descripción',cx[0],y+9,8.5,false,INK);
      pg.text('Cant.',cx[1]+cols[1]/2,y+9,8.5,false,INK,'center');
      pg.text('Valor unit.',cx[2]+cols[2],y+9,8.5,false,INK,'right');
      pg.text('IVA',cx[3]+cols[3],y+9,8.5,false,INK,'right');
      pg.text('Total',cx[4]+cols[4],y+9,8.5,false,INK,'right');
      pg.hline(MX,MX+CW,y+15,INK,0.8);
      y+=24;
    };
    const ensure=(h,withTH)=>{ if(y+h>PH-BOT){ newPage(true); if(withTH) drawTH(); } };
    drawTH();
    for(const l of m.lines){
      const nl=wrap(l.name||'(sin nombre)',9.5,false,cols[0]-12);

      let h=6+nl.length*12+sub.length*9.5+8; h=Math.max(h,l.unit?34:28);
      ensure(h,true);
      let ty=y+13; for(const t of nl){ pg.text(t,cx[0],ty,9.5,false,INK); ty+=12; }

      pg.text(moneyPlain(l.price),cx[2]+cols[2],y+13,9.5,false,INK,'right');
      pg.text(fmtPct(l.iva),cx[3]+cols[3],y+13,9.5,false,INK,'right');
      pg.text(moneyPlain(l.total),cx[4]+cols[4],y+13,9.5,false,INK,'right');
      y+=h;
    }
    y+=2; pg.hline(MX,MX+CW,y,INK,0.8); y+=24;

    /* validez (izquierda) + totales (derecha) */
    const rows=[['Subtotal',fmtMoney(m.subtotal)]];
    if(m.discount>0) rows.push(['Descuento ('+fmtPct(m.discountPct)+')','- '+fmtMoney(m.discount)]);
    for(const g of m.ivaGroups) if(g.rate>0) rows.push(['IVA '+fmtPct(g.rate),fmtMoney(g.amount)]);
    const vtxt=wrap('Esta cotización es válida por '+m.validity+(m.validity===1?' día':' días')+', hasta el '+m.validUntil+'.',8.5,false,200);
    const totH=rows.length*14+44;
    ensure(Math.max(totH,16+vtxt.length*11),false);
    const x0=PW-MX-230;
    pg.text('Validez',MX,y+8,7.5,false,MUTED);
    vtxt.forEach((t,i)=>pg.text(t,MX,y+21+i*11,8.5,false,INK));
    rows.forEach((r,i)=>{ pg.text(r[0],x0,y+8+i*14,8.5,false,MUTED); pg.text(r[1],PW-MX,y+8+i*14,8.5,false,INK,'right'); });
    const ty=y+rows.length*14+24, tv=fmtMoney(m.total);

    pg.text('Total',x0,ty,12,false,INK);
    pg.hline(x0+lw+10,PW-MX-vw-10,ty-4,INK,0.6);
    pg.text(tv,PW-MX,ty,20,false,INK,'right');
    y=Math.max(ty+12,y+16+vtxt.length*11)+8;

    /* pie: gracias + términos */
    const tl=[];
    const tx=[]; if((m.terms||'').trim()) tx.push(m.terms.trim()); if((m.notes||'').trim()) tx.push(m.notes.trim());
    for(const t of tx){ for(const ln of wrap(t,7.5,false,250)) tl.push(ln); tl.push(null); }
    const tH=tx.length?16+tl.length*9.5:0;
    const thanks=wrap('Gracias por tu confianza',15,false,190);
    const blockH=Math.max(thanks.length*18,tH);
    if(y+blockH+20>PH-46){ newPage(true); }
    const yb=Math.max(y+14,PH-54-blockH);
    thanks.forEach((t,i)=>pg.text(t,MX,yb+14+i*18,15,false,INK));
    if(tx.length){
      pg.text('Términos y condiciones',PW-MX,yb+8,8.5,true,INK,'right');
      let yy=yb+22; for(const ln of tl){ if(ln===null){ yy+=4; continue; } pg.text(ln,PW-MX,yy,7.5,false,MUTED,'right'); yy+=9.5; }
    }
    if(pages.length>1) pages.forEach((p,i)=>p.text('Página '+(i+1)+' de '+pages.length,PW/2,PH-20,7.5,false,MUTED,'center'));
    return savePdf(pages,img,'Cotizacion '+m.number,shs);
  }

  function cleanTemplate(o){
    o=o||{};
    return {id:str(o.id,24)||uid(),name:str(o.name,60),lines:(Array.isArray(o.lines)?o.lines:[]).slice(0,100).map(cleanLine),
      discount:num(o.discount,0,0,100),notes:str(o.notes,1200),validity:Math.round(num(o.validity,15,0,365)),updatedAt:Math.round(num(o.updatedAt,Date.now(),0,9e15))};
  }

  return {uid,parseNum,fmtInt,fmtMoney,fmtMoney2,moneyPlain,qtyPlain,fmtQty,fmtPct,dateLong,addDays,fmtNumber,isoDay,fromIso,
    hex2rgb,mix,lum,textOn,blobColor,gradEnd,defaultBrand,cleanBrand,cleanItem,cleanLine,newDraft,cleanDraft,cleanQuote,cleanTemplate,STATUSES,calc,buildModel,
    parseCSV,csvToItems,toCSV,renderPdf,tw,wrap,jpegInfo};
})();
/*PURE-END*/

/* ---------- red de seguridad: el error se pinta en pantalla ---------- */
function showFatal(msg){
  const f=document.getElementById('fatal'); if(!f) return;
  f.hidden=false; f.textContent='Algo falló en la app:\n'+msg+'\n\nCopia este mensaje y envíaselo a quien te dio la herramienta.';

window.addEventListener('unhandledrejection',e=>showFatal(String(e.reason&&e.reason.message||e.reason||'promesa rechazada')));
function safe(fn){ return function(){ try{ return fn.apply(this,arguments); }catch(err){ showFatal(err&&err.stack?err.message+' | '+String(err.stack).split('\n')[1]:String(err)); } }; }

function load(){
  storageOK=storageTest();

  try{
    const raw=localStorage.getItem(KEY); if(!raw) return;
    const o=JSON.parse(raw);

    S.catalog=(Array.isArray(o.catalog)?o.catalog:[]).slice(0,2000).map(C.cleanItem);

  syncQuote();

    const quota=!!e&&(e.name==='QuotaExceededError'||e.code===22||e.code===1014);
    if(quota){ if(!storageFull){ storageFull=true; renderBanner(); } }
    else{ storageOK=false; renderBanner(); }

}

}

function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); },5000);
}
/* Entrega de archivos: dentro de Claude se usa la capacidad «downloads» (en el iPhone abre el menú nativo con el archivo real).
   Fuera de Claude (archivo suelto en un navegador) se usa compartir del sistema y, si no, la descarga normal. */
let DL=null;
try{ if(window.claude&&typeof window.claude.use==='function'){ Promise.resolve(window.claude.use('downloads')).then(d=>{ DL=d||null; refreshExportUi(); },()=>{}); } }catch(e){}
async function deliverFile(blob,name,shareTitle){
  if(DL){
    try{ await DL.save({filename:name,data:blob}); return 'ok'; }
    catch(err){
      if(err&&err.code==='declined') return 'declined';
      if(err&&(err.code==='unavailable'||err.code==='not_granted'||err.code==='capability_disabled'||err.code==='capability_removed')) DL=null; else return 'error';
    }
  }
  try{
    const file=new File([blob],name,{type:blob.type||'application/octet-stream'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:shareTitle||name}); return 'ok'; }
  }catch(err){ if(err&&err.name==='AbortError') return 'declined'; }
  downloadBlob(blob,name); return 'fallback';
}

function ivaCtl(value,inherit,defIva){

  const other=value!=null&&!isStd;
  const sel=other?'otro':(value==null?'inh':String(value));
  const opt=(v,t)=>'<option value="'+v+'"'+(sel===v?' selected':'')+'>'+t+'</option>';
  return '<div class="ivactl"><select data-f="ivaSel" aria-label="IVA">'+
    (inherit?opt('inh','Predeterminado ('+C.qtyPlain(defIva)+'%)'):'')+
    opt('0','0% (exento)')+opt('5','5%')+opt('19','19%')+opt('otro','Otro…')+'</select>'+
    '<input class="oth" data-f="iva" inputmode="decimal" aria-label="Porcentaje de IVA" placeholder="%" value="'+(other?esc(C.qtyPlain(value)):'')+'"'+(other?'':' hidden')+'></div>';
}
function wireIva(box,onChange){
  box.addEventListener('change',e=>{
    if(e.target.dataset.f!=='ivaSel') return;
    const o=$('.oth',box); o.hidden=e.target.value!=='otro';
    if(e.target.value==='otro'){ o.focus(); } onChange(readIva(box));
  });
  box.addEventListener('input',e=>{ if(e.target.dataset.f==='iva') onChange(readIva(box)); });
}
function readIva(box){
  const v=$('[data-f=ivaSel]',box).value;
  if(v==='inh') return null;
  if(v==='otro'){ const n=C.parseNum($('.oth',box).value); return isFinite(n)?Math.min(100,Math.max(0,n)):0; }
  return Number(v);
}

const NUMF={validity:{min:0,max:365},nextNumber:{min:1,max:999999}};
function fillBrand(){
  $$('[data-b]').forEach(el=>{ const k=el.dataset.b; el.value=S.brand[k]==null?'':S.brand[k]; });
  $('#bIva').innerHTML=ivaCtl(S.brand.iva,false,S.brand.iva);
}
function wireBrand(){
  $$('[data-b]').forEach(el=>el.addEventListener('input',safe(()=>{
    const k=el.dataset.b; let v=el.value;
    if(k==='color1'||k==='color2') S.brand[k]=v;
    else if(k==='validity'||k==='nextNumber'){ const n=C.parseNum(v); if(isFinite(n)) S.brand[k]=Math.round(Math.min(NUMF[k].max,Math.max(NUMF[k].min,n))); }
    else if(k==='cc'){ S.brand.cc=v.replace(/\D/g,'').slice(0,4)||'57'; }
    else S.brand[k]=v;
    applyTheme(); updateTotals(); save();
  })));
  wireIva($('#bIva'),safe(v=>{ S.brand.iva=v==null?19:v; save(); renderResults(); }));
  $('#swatches').addEventListener('click',safe(e=>{
    const b=e.target.closest('.sw'); if(!b) return;
    S.brand.color1=b.dataset.c1; S.brand.color2=b.dataset.c2;
    $('[data-b=color1]').value=S.brand.color1; $('[data-b=color2]').value=S.brand.color2;
    applyTheme(); updateTotals(); save();
  }));
  $('#logoFile').addEventListener('change',safe(async e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f) return;
    if(f.size>12*1024*1024){ toast('Ese archivo es muy pesado. Prueba con uno más liviano.'); return; }
    try{ S.brand.logo=await processLogo(f); applyTheme(); updateTotals(); saveNow(); toast('Logo cargado'); }
    catch(err){ toast('No pude leer esa imagen. Prueba con un PNG o JPG.'); }
  }));
  $('#logoDel').addEventListener('click',safe(()=>{ S.brand.logo=''; applyTheme(); updateTotals(); saveNow(); }));
  $('#bkExp').addEventListener('click',safe(()=>{
    const data={app:'cotizador',version:3,brand:S.brand,catalog:S.catalog,quotes:S.quotes,templates:S.templates};
    deliverFile(new Blob([JSON.stringify(data)],{type:'application/json'}),'respaldo-cotizador-'+C.isoDay(new Date())+'.json').then(r=>{ if(r==='ok'||r==='fallback') toast('Respaldo listo. Guárdalo en un lugar seguro.'); else if(r==='error') toast('No pude entregar el respaldo. Intenta de nuevo.'); });
  }));
  $('#bkImp').addEventListener('change',safe(async e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f) return;
    let o; try{ o=JSON.parse(await f.text()); }catch(err){ toast('Ese archivo no es un respaldo válido.'); return; }
    if(!o||o.app!=='cotizador'){ toast('Ese archivo no es un respaldo de esta herramienta.'); return; }
    const ok=await askConfirm('Se reemplazarán tu marca, tu logo, tu catálogo, tu historial y tus plantillas actuales por los del respaldo. ¿Continuar?','Sí, importar',true);
    if(!ok) return;
    S.brand=C.cleanBrand(o.brand); S.catalog=(Array.isArray(o.catalog)?o.catalog:[]).slice(0,2000).map(C.cleanItem);
    S.quotes=(Array.isArray(o.quotes)?o.quotes:[]).slice(0,MAXQ).map(q=>C.cleanQuote(q,S.brand.validity));
    if(Array.isArray(o.templates)) S.templates=o.templates.slice(0,MAXT).map(C.cleanTemplate);
    S.draft=C.newDraft(S.brand.validity); fillBrand(); fillDraft(); applyTheme(); renderCatalog(); renderResults(); renderLines(); updateTotals(); renderHistory(); saveNow();
    toast('Respaldo importado');
  }));
  $('#goCat').addEventListener('click',()=>setTab('catalogo'));
}
function processLogo(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('lectura'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('imagen'));
      img.onload=()=>{
        let w=img.naturalWidth,h=img.naturalHeight;
        if(!w||!h){ rej(new Error('sin tamaño')); return; }
        const sc=Math.min(1,480/Math.max(w,h)); w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const cx=cv.getContext('2d'); cx.fillStyle='#f3f3f5'; cx.fillRect(0,0,w,h); cx.drawImage(img,0,0,w,h); /* mismo tono que el fondo del PDF: así no se ve recuadro */
        res(cv.toDataURL('image/jpeg',0.88));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function importCsv(file){
  let text;
  const buf=await file.arrayBuffer();
  try{ text=new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ text=new TextDecoder('windows-1252').decode(buf); }
  const r=C.csvToItems(text);
  if(!r.items.length){ toast('No encontré filas válidas. Revisa que haya columnas «nombre» y «precio».',4200); return; }
  const room=2000-S.catalog.length; const add=r.items.slice(0,Math.max(0,room));
  S.catalog=add.concat(S.catalog); renderCatalog(); renderResults(); saveNow();
  toast(add.length+' agregados'+(r.skipped?' · '+r.skipped+' filas omitidas (sin nombre o sin precio)':''),4200);
}

/* vista previa: misma composición que el PDF (hoja carta, manchas difuminadas) */
function blobCss(pos,r,c0,bg){
  const stops=[0,.25,.5,.7,.85].map(t=>C.mix(c0,bg,Math.pow(t,2.2))+' '+Math.round(t*r)+'px');
  stops.push(bg+' '+r+'px','rgba(243,243,245,0) '+(r+1)+'px');
  return 'radial-gradient(circle at '+pos+','+stops.join(',')+')';
}
function paperHtml(m){
  const b=m.brand, cl=m.client, BG='#f3f3f5';

/* ---------- PDF, compartir y WhatsApp ---------- */
function readyToExport(){
  if(!S.draft.lines.some(l=>(Number(l.qty)||0)>0)){ toast('Agrega al menos un ítem con cantidad.'); return false; }
  if(!S.brand.name.trim()){ toast('Primero escribe el nombre de tu negocio en «Mi marca».',3600); setTab('marca'); return false; }
  return true;
}
function assignNumber(){
  if(!S.draft.number){ S.draft.number=S.brand.nextNumber; S.brand.nextNumber=S.brand.nextNumber+1; $('[data-b=nextNumber]').value=S.brand.nextNumber; }
  if(!S.draft.dateISO) S.draft.dateISO=C.isoDay(new Date());
  saveNow();
}
function makePdf(){
  assignNumber(); const m=model();
  const bytes=C.renderPdf(m);
  const who=slug(S.draft.client.name||S.draft.client.company);
  const name='Cotizacion-'+m.number+(who?'-'+who:'')+'.pdf';
  updateTotals();
  return {blob:new Blob([bytes],{type:'application/pdf'}),m:m,name:name};
}
async function exportPdf(){
  if(!readyToExport()) return;
  const r=makePdf();
  saveQuote();                         /* la cotización queda en el historial aunque luego cancelen el envío */
  const res=await deliverFile(r.blob,r.name,'Cotización '+r.m.number+' de '+S.brand.name);
  if(res==='ok'){ saveQuote('enviada'); toast('Listo. Quedó guardada en el historial.',3000); }
  else if(res==='fallback'){ saveQuote('enviada'); toast('Se descargó el PDF. Ábrelo desde tus descargas para enviarlo.',5200); }
  else if(res==='declined'){ toast('No se envió. La cotización sigue guardada en el historial.',3600); }
  else toast('No pude entregar el PDF. Intenta de nuevo.',4000);
}
function refreshExportUi(){
  const h=$('#shareHint'); if(!h) return;
  h.textContent=DL
    ?'«Compartir PDF» abre el menú de tu teléfono: elige WhatsApp para mandar el PDF, o «Guardar en Archivos». «Avisar por WhatsApp» solo abre el chat con un mensaje de texto.'
    :'«Compartir PDF» abre el menú de tu teléfono (WhatsApp, Drive, Guardar en archivos…) o descarga el archivo. «Avisar por WhatsApp» solo abre el chat con un mensaje de texto.';
}

/* ---------- historial de cotizaciones ---------- */
function snapshot(){ return C.cleanDraft(JSON.parse(JSON.stringify(S.draft)),S.brand.validity); }
function syncQuote(){
  if(!S.draft.qid) return;
  const q=S.quotes.find(x=>x.id===S.draft.qid); if(!q) return;
  try{ q.draft=snapshot(); q.total=C.buildModel(S.brand,S.draft,new Date()).total; }catch(e){}
}
function saveQuote(status){
  if(!S.draft.lines.length) return null;
  if(!S.draft.qid) S.draft.qid=C.uid();
  let q=S.quotes.find(x=>x.id===S.draft.qid);
  if(!q){ q=C.cleanQuote({id:S.draft.qid,status:'borrador',draft:S.draft}); S.quotes.unshift(q); if(S.quotes.length>MAXQ) S.quotes.length=MAXQ; }
  if(status) q.status=status;
  q.savedAt=Date.now(); syncQuote(); saveNow();
  if(S.tab==='hist') renderHistory();
  return q;
}
function startNew(announce){
  const had=S.draft.lines.length>0;
  if(had) saveQuote();
  S.draft=C.newDraft(S.brand.validity); fillDraft(); renderLines(); renderResults(); updateTotals(); saveNow(); window.scrollTo(0,0);
  if(announce&&had) toast('La anterior quedó guardada en el historial',2800);
}
function openQuote(id){
  const q=S.quotes.find(x=>x.id===id); if(!q) return;
  if(S.draft.qid!==id&&S.draft.lines.length) saveQuote();
  S.draft=C.cleanDraft(JSON.parse(JSON.stringify(q.draft)),S.brand.validity); S.draft.qid=id;
  saveNow(); setTab('cotiz');
}
function duplicateQuote(id){
  const q=S.quotes.find(x=>x.id===id); if(!q) return;
  if(S.draft.lines.length) saveQuote();
  const d=C.cleanDraft(JSON.parse(JSON.stringify(q.draft)),S.brand.validity);
  d.qid=null; d.number=null; d.dateISO=null; d.lines.forEach(l=>{ l.id=C.uid(); });
  S.draft=d; saveNow(); setTab('cotiz'); toast('Copia lista: cámbiala y envíala',2600);
}
async function pdfOfQuote(id){
  const q=S.quotes.find(x=>x.id===id); if(!q) return;
  if(!q.draft.number){ q.draft.number=S.brand.nextNumber; S.brand.nextNumber++; const nb=$('[data-b=nextNumber]'); if(nb) nb.value=S.brand.nextNumber; if(S.draft.qid===id) S.draft.number=q.draft.number; }
  if(!q.draft.dateISO){ q.draft.dateISO=C.isoDay(new Date()); if(S.draft.qid===id) S.draft.dateISO=q.draft.dateISO; }
  const m=C.buildModel(S.brand,q.draft,new Date());
  const who=slug(q.draft.client.name||q.draft.client.company);
  const name='Cotizacion-'+m.number+(who?'-'+who:'')+'.pdf';
  const res=await deliverFile(new Blob([C.renderPdf(m)],{type:'application/pdf'}),name,'Cotización '+m.number+' de '+S.brand.name);
  if(res==='ok'||res==='fallback'){ q.status=q.status==='borrador'?'enviada':q.status; saveNow(); renderHistory(); toast(res==='ok'?'Listo':'Se descargó el PDF',2400); }
  else if(res==='error') toast('No pude entregar el PDF. Intenta de nuevo.',4000);
}
const ST_LABEL={borrador:'Borrador',enviada:'Enviada',aceptada:'Aceptada',rechazada:'Rechazada'};
function renderHistory(){
  const box=$('#hList'); if(!box) return;
  const qs=normS($('#hQ').value);
  const all=S.quotes.slice().sort((a,b)=>b.savedAt-a.savedAt);
  const list=all.filter(q=>{ if(!qs) return true; const d=q.draft; return normS((d.client.name||'')+' '+(d.client.company||'')+' '+(d.number?C.fmtNumber(d.number):'')).indexOf(qs)>=0; });
  $('#hCount').textContent=all.length?(all.length+(all.length===1?' cotización guardada':' cotizaciones guardadas')):'';
  if(!all.length){ box.innerHTML='<div class="empty">Aquí aparecerán tus cotizaciones. Se guardan solas cuando compartes el PDF o empiezas una nueva.</div>'; return; }
  if(!list.length){ box.innerHTML='<div class="empty">No encontré nada con esa búsqueda.</div>'; return; }
  box.innerHTML=list.map(q=>{
    const d=q.draft, who=d.client.name||d.client.company||'Sin cliente';
    const when=d.dateISO?C.dateLong(C.fromIso(d.dateISO)):C.dateLong(new Date(q.savedAt));
    return '<div class="hq" data-id="'+esc(q.id)+'"><div class="hq-top"><div class="meta"><strong>'+esc(who)+'</strong><small>'+(d.number?'N.º '+esc(C.fmtNumber(d.number))+' · ':'Sin número · ')+esc(when)+'</small></div><b class="hq-tot">'+esc(C.fmtMoney(q.total))+'</b></div>'+
      '<div class="hq-mid"><select data-act="status" class="st st-'+q.status+'" aria-label="Estado de la cotización">'+C.STATUSES.map(s=>'<option value="'+s+'"'+(q.status===s?' selected':'')+'>'+ST_LABEL[s]+'</option>').join('')+'</select></div>'+
      '<div class="hq-acts"><button class="btn sm" data-act="open" type="button">Abrir</button><button class="btn sm" data-act="pdf" type="button">PDF</button><button class="btn sm" data-act="dup" type="button">Duplicar</button><button class="icon dng" data-act="del" type="button" aria-label="Eliminar">'+IC.trash+'</button></div></div>';
  }).join('');
}
function wireHistory(){
  $('#hQ').addEventListener('input',safe(renderHistory));
  const box=$('#hList');
  box.addEventListener('change',safe(e=>{
    if(e.target.dataset.act!=='status') return;
    const q=S.quotes.find(x=>x.id===e.target.closest('.hq').dataset.id); if(!q) return;
    q.status=e.target.value; saveNow(); renderHistory();
  }));
  box.addEventListener('click',safe(async e=>{
    const b=e.target.closest('button[data-act]'); if(!b) return;
    const id=b.closest('.hq').dataset.id;
    if(b.dataset.act==='open') openQuote(id);
    else if(b.dataset.act==='dup') duplicateQuote(id);
    else if(b.dataset.act==='pdf') pdfOfQuote(id);
    else if(b.dataset.act==='del'){
      if(!(await askConfirm('¿Eliminar esta cotización del historial? No se puede deshacer.','Sí, eliminar',true))) return;
      S.quotes=S.quotes.filter(x=>x.id!==id);
      if(S.draft.qid===id){ S.draft=C.newDraft(S.brand.validity); }
      saveNow(); renderHistory();
    }
  }));
}
function waUrl(phone,text){
  let d=String(phone||'').replace(/\D/g,'');
  if(d&&d.length<=10) d=S.brand.cc+d.replace(/^0+/,'');
  return 'https://wa.me/'+d+'?text='+encodeURIComponent(text);
}
function openWhatsApp(){
  if(!S.draft.lines.length){ toast('Agrega al menos un ítem primero.'); return; }
  const m=model(), nm=(S.draft.client.name||'').trim();

  const a=document.createElement('a'); a.href=waUrl(S.draft.client.phone,text); a.target='_blank'; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();
  if(!S.draft.client.phone.trim()) toast('Sin teléfono del cliente: elige el contacto en WhatsApp.',3600);

    ?'<select id="tPick" aria-label="Agregar un ítem del catálogo"><option value="">+ Agregar un ítem del catálogo…</option>'+S.catalog.slice(0,400).map(it=>'<option value="'+esc(it.id)+'">'+esc(it.name)+' · '+esc(C.fmtMoney2(it.price))+'</option>').join('')+'</select>'

    '<div class="row" style="margin-top:8px"><button class="btn sm" id="tManual" type="button">+ Línea manual</button>'+(S.catalog.length?'<button class="link" id="tRef" type="button">Actualizar precios con mi catálogo</button>':'')+'</div>'+

    '<label class="f"><span>Validez (días)</span><input id="tVal" inputmode="numeric" value="'+esc(String(w.validity))+'"></label></div>'+
    '<label class="f" style="margin-top:12px"><span>Notas (opcional)</span><textarea id="tNotes" placeholder="Ej.: Entrega estimada en 10 días hábiles.">'+esc(w.notes)+'</textarea></label>'+

    const x=e.target.closest('[data-x]');
    if(x){
      if(x.dataset.x==='no'){ closeModal(); return; }
      const name=$('#tName',m).value.trim(), err=$('#tErr',m);
      if(!name){ err.textContent='Escribe el nombre de la plantilla.'; return; }
      if(!w.lines.length){ err.textContent='Agrega al menos un ítem.'; return; }
      if(w.lines.some(l=>!String(l.name).trim())){ err.textContent='Escribe el concepto de cada línea manual.'; return; }
      const v=C.parseNum($('#tVal',m).value);
      const data=C.cleanTemplate({id:t?t.id:null,name:name,lines:w.lines,discount:w.discount,notes:$('#tNotes',m).value,validity:isFinite(v)?v:S.brand.validity,updatedAt:Date.now()});
      if(t) Object.assign(t,data); else{ S.templates.unshift(data); if(S.templates.length>MAXT) S.templates.length=MAXT; }
      saveNow(); closeModal(); renderTemplates(); renderTplQuick(); toast('Plantilla guardada',2200);
      return;
    }
    if(e.target.closest('#tManual')){
      w.lines.push(C.cleanLine({id:C.uid(),name:'',qty:1,price:0,disc:0,iva:S.brand.iva,manual:true}));
      renderTLines(); const ins=$$('[data-f=name]',lines); if(ins.length) ins[ins.length-1].focus(); return;
    }
    if(e.target.closest('#tRef')){
      let k=0;
      w.lines.forEach(l=>{ const it=l.catId&&S.catalog.find(c=>c.id===l.catId); if(it){ l.name=it.name; l.desc=it.desc; l.unit=it.unit; l.price=it.price; l.iva=it.iva==null?S.brand.iva:it.iva; k++; } });
      renderTLines(); toast(k?(k+(k===1?' precio actualizado':' precios actualizados')):'Ningún ítem viene del catálogo',2600); return;
    }
    const b=e.target.closest('[data-act]'); if(!b) return;
    const row=b.closest('.line'), l=row&&getL(row); if(!l) return;
    if(b.dataset.act==='del'){ w.lines=w.lines.filter(z=>z!==l); renderTLines(); return; }
    l.qty=b.dataset.act==='inc'?(Number(l.qty)||0)+1:Math.max(1,(Number(l.qty)||0)-1);
    $('[data-f=qty]',row).value=C.qtyPlain(l.qty); updateTTot();
  }));
  $('#tName',m).focus();
}
function wireTemplates(){
  $('#tAdd').addEventListener('click',safe(()=>openTplEditor(null,null)));
  $('#bTpl').addEventListener('click',safe(()=>{
    if(!S.draft.lines.length){ toast('Agrega al menos un ítem primero.'); return; }
    openTplEditor(null,{name:'',lines:S.draft.lines,discount:S.draft.discount,notes:S.draft.notes,validity:S.draft.validity});
  }));
  $('#tplQuick').addEventListener('click',safe(e=>{
    const b=e.target.closest('[data-tpl]'); if(!b) return;
    const t=S.templates.find(x=>x.id===b.dataset.tpl); if(!t) return;
    applyTemplate(t); toast('Plantilla «'+t.name+'» lista. Agrega el cliente y envía.',3000);
  }));
  $('#tList').addEventListener('click',safe(async e=>{
    const b=e.target.closest('[data-act]'); if(!b) return;
    const id=b.closest('.tcard').dataset.id, t=S.templates.find(x=>x.id===id); if(!t) return;
    if(b.dataset.act==='use') useTemplate(id);
    else if(b.dataset.act==='edit') openTplEditor(id,null);
    else if(b.dataset.act==='dup'){
      const c=C.cleanTemplate(copyOf(t)); c.id=C.uid(); c.name=(t.name+' (copia)').slice(0,60); c.updatedAt=Date.now();
      S.templates.unshift(c); if(S.templates.length>MAXT) S.templates.length=MAXT;
      saveNow(); renderTemplates(); toast('Copia creada',2200);
    }
    else if(b.dataset.act==='del'){
      if(!(await askConfirm('¿Eliminar la plantilla «'+t.name+'»? Las cotizaciones que ya hiciste con ella no se tocan.','Sí, eliminar',true))) return;
      S.templates=S.templates.filter(x=>x.id!==id); saveNow(); renderTemplates(); renderTplQuick();
    }
  }));
}

/* ---------- navegación y formato de dinero al salir del campo ---------- */
function setTab(t){
  S.tab=t;
  ['marca','catalogo','plant','cotiz','hist'].forEach(k=>{ $('#p-'+k).hidden=(k!==t); });
  $$('.nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t?'true':'false'));
  $('#heroT').textContent=HERO[t][0]; $('#heroS').textContent=HERO[t][1];
  $('#heroS').hidden=(t!=='marca'&&t!=='plant');
  $('#sbCat').hidden=(t!=='catalogo'); $('#sbQ').hidden=(t!=='cotiz'); $('#sbH').hidden=(t!=='hist');
  if(t==='hist') renderHistory();
  if(t==='plant') renderTemplates();
  if(t==='cotiz'){ renderResults(); renderLines(); fillDraft(); updateTotals(); }
  if(t==='catalogo') renderCatalog();
  syncMini();
  window.scrollTo(0,0);
}
document.addEventListener('focusout',e=>{
  const t=e.target; if(!t||!t.matches||!t.matches('[data-money]')) return;
  const n=C.parseNum(t.value); if(isFinite(n)&&n>=0) t.value=C.moneyPlain(n);
});

/* ---------- arranque ---------- */
safe(function(){
  load(); buildShell(); fillBrand(); wireBrand(); wireCatalog(); wireQuote(); wireHistory(); wireTemplates(); refreshExportUi();
  /* datos que llegaron de otro teléfono (versión web con espacio compartido) */
  window.addEventListener('appsync:applied',safe(e=>{
    if(!e.detail||e.detail.tool!=='cotizador') return;
    const active=document.activeElement, typing=active&&/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName);
    const draft=S.draft; load(); S.draft=draft;   /* el borrador es de este teléfono: se conserva lo que se está escribiendo */
    if(!typing) fillBrand(); applyTheme(); renderCatalog(); renderResults(); renderLines(); updateTotals(); renderHistory(); renderTemplates(); renderTplQuick();
  }));
  $$('.nav button').forEach(b=>b.addEventListener('click',safe(()=>setTab(b.dataset.tab))));
  if('IntersectionObserver' in window){
    new IntersectionObserver(es=>{ totVisible=es[0].isIntersecting; syncMini(); },{threshold:.2}).observe($('#totCard'));
  }
  applyTheme(); renderBanner(); renderCatalog();
  setTab(S.brand.name.trim()?'cotiz':'marca');
})();
})();
</script>
